<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Админ — Монгол аялал</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=202611181140">
<style>
header{padding:20px 0 18px}
header h1{font-size:24px}
.adm-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:700px){.adm-stats{grid-template-columns:repeat(2,1fr)}}
.rq{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.rq:last-child{border-bottom:none}
.rq .who{font-weight:600}
.rq .meta{font-size:13px;color:var(--muted)}
.rq .ref{font-weight:700;color:var(--sun);letter-spacing:.4px}
.rq .act{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.rq input{width:64px;font:14px Rubik,sans-serif;padding:6px;border:1.5px solid var(--line);border-radius:8px}
.btn.sm{padding:7px 12px;font-size:13.5px;border-radius:9px}
.btn.ok{background:var(--steppe)}
.btn.no{background:#fff;color:var(--red);border:1.5px solid #f1c4bf}
.st{font-size:12px;border-radius:6px;padding:2px 7px;font-weight:600}
.st.pending{background:var(--sun2);color:#9a4a0b}.st.approved{background:var(--steppe2);color:var(--steppe)}.st.rejected{background:var(--red2);color:var(--red)}
.grant{display:flex;gap:8px;flex-wrap:wrap}
.grant input{flex:1;min-width:200px}
.grant input[type=number]{flex:none;width:90px;min-width:0}
.adm-ph{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.adm-phc img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="acct" id="acct"></div>
  <h1>🛠️ Админ</h1>
  <p><a href="./" style="color:#fff">← Сайт руу буцах</a></p>
</div></header>

<main class="wrap" id="main"><div class="empty">Ачаалж байна…</div></main>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal-box"><button class="modal-x" onclick="closeModal()" aria-label="Хаах">×</button><div id="modalBody"></div></div>
</div>
<div class="toast" id="toast"></div>

<script src="config.js?v=202611181140"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js?v=202611181140"></script>
<script>
const $=s=>document.querySelector(s);
const cfg=window.APP_CONFIG||{};
const fmt=n=>Math.round(n||0).toLocaleString('en-US').replace(/,/g,' ');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dt=s=>s?new Date(s).toLocaleString():'';
function openModal(h){$('#modalBody').innerHTML=h;$('#modal').classList.add('open')}
function closeModal(){$('#modal').classList.remove('open')}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),2800)}

let tab='pending', admin=null;

function openLogin(){
 openModal(`<h3>Админ нэвтрэх</h3>
  <form onsubmit="pwLogin(event)"><input class="field" type="email" id="loginEmail" placeholder="Имэйл" autocomplete="email" required>
  <input class="field" type="password" id="loginPass" placeholder="Нууц үг" autocomplete="current-password" required>
  <div id="lMsg" class="note" style="color:var(--red)"></div>
  <button class="btn wide" type="submit">Нэвтрэх</button></form>
  <p class="note"><a href="#" onclick="magicLogin();return false">Нууц үггүйгээр имэйлээр нэвтрэх</a></p>`);
}
async function pwLogin(e){
 e.preventDefault();
 const {error}=await Auth.signInPassword($('#loginEmail').value.trim(),$('#loginPass').value);
 if(error){$('#lMsg').textContent=/Invalid login/i.test(error.message)?'Имэйл эсвэл нууц үг буруу (нууц үг тохируулаагүй бол доорх холбоосоор нэвтэрнэ)':error.message;return}
 closeModal();
}
async function magicLogin(){
 const email=($('#loginEmail')||{}).value; if(!email){$('#lMsg').textContent='Эхлээд имэйлээ бичнэ үү';return}
 const {error}=await Auth.signInEmail(email.trim());
 $('#modalBody').innerHTML=error?`<h3>Алдаа</h3><p>${esc(error.message)}</p>`:`<h3>📩 Имэйлээ шалгаарай</h3><p>${esc(email)} руу холбоос илгээлээ.</p>`;
}

function renderAcct(){
 const u=Auth.user;
 $('#acct').innerHTML=u?`<span class="who">${esc(u.email)}</span><button onclick="Auth.signOut()">Гарах</button>`:'<button class="solid" onclick="openLogin()">Нэвтрэх</button>';
}

async function load(){
 renderAcct();
 if(!Auth.configured){$('#main').innerHTML='<div class="card empty">config.js-д Supabase тохируулаагүй байна.</div>';return}
 if(!Auth.ready) return;
 if(!Auth.user){$('#main').innerHTML='<div class="card empty">Админ хэсэгт орохын тулд нэвтэрнэ үү.<br><br><button class="btn" onclick="openLogin()">Нэвтрэх</button></div>';return}
 if(admin===null) admin=await Auth.isAdmin();
 if(!admin){$('#main').innerHTML='<div class="card empty">Энэ бүртгэлд админ эрх алга.</div>';return}
 const [{data:st,error:e1},{data:rows,error:e2},fbc,hsc,acc]=await Promise.all([Auth.stats(),
  tab==='photos'?Auth.listPhotos({admin:true,limit:200}):tab==='stories'?Auth.listStories({admin:true,limit:200}):tab==='camps'?Auth.listCampsAdmin():tab==='roads'?Auth.listRoads():tab==='reports'?Auth.listReports():
  tab==='premium'?Auth.listPremium():tab==='feedback'?Auth.listFeedback():tab==='fuel'?Auth.fuelPrices():tab==='homestay'?Auth.listHomestaysAdmin():Auth.listRequests(tab==='all'?null:tab),
  Auth.countNewFeedback(),Auth.countPendingHomestays(),Auth.adminCounts()]);
 const fbNew=(fbc&&fbc.count)||0, hsNew=(hsc&&hsc.count)||0, cc=(acc&&acc.data)||{};
 if(e1||e2){$('#main').innerHTML=`<div class="card empty">Алдаа: ${esc((e1||e2).message)}</div>`;return}
 const s=st||{};
 const tabs=[['pending',`Хүлээгдэж буй (${s.pending||0})`],['approved','Батлагдсан'],['rejected','Татгалзсан'],['all','Бүгд'],['premium',`Премиум хэрэглэгчид (${s.premium||0})`],['feedback',`💬 Санал хүсэлт${fbNew?` (${fbNew} шинэ)`:''}`],['homestay',`🐎 Айл буудал${hsNew?` (${hsNew} шинэ)`:''}`],['fuel','⛽ Шатахууны үнэ'],
  ['photos',`📷 Зураг${cc.photos?` (${cc.photos} шинэ)`:''}`],['stories',`📖 Түүх${cc.stories?` (${cc.stories} шинэ)`:''}`],['camps',`🏕️ Кемп${cc.camps?` (${cc.camps} шинэ)`:''}`],['roads',`🚧 Замын мэдээ (${cc.roads||0})`],['reports',`🚩 Мэдээлэл${cc.reports?` (${cc.reports} шинэ)`:''}`]];
 $('#main').innerHTML=`
  <section class="adm-stats">
   <div class="stat"><b>${fmt(s.users)}</b><span>Нийт хэрэглэгч</span></div>
   <div class="stat"><b>${fmt(s.premium)}</b><span>Идэвхтэй премиум</span></div>
   <div class="stat warm"><b>${fmt(s.revenue_month)}₮</b><span>Энэ сарын орлого</span></div>
   <div class="stat warm"><b>${fmt(s.revenue)}₮</b><span>Нийт орлого</span></div>
  </section>
  <section class="card">
   <div class="tabs">${tabs.map(([k,l])=>`<button class="tab ${k===tab?'on':''}" onclick="setTab('${k}')">${l}</button>`).join('')}</div>
   ${tab==='photos'?photoAdm(rows):tab==='stories'?storyAdm(rows):tab==='camps'?campAdm(rows):tab==='roads'?roadAdm(rows):tab==='reports'?reportAdm(rows):tab==='premium'?premiumList(rows):tab==='feedback'?fbList(rows):tab==='fuel'?fuelList(rows):tab==='homestay'?hsList(rows):reqList(rows)}
  </section>
  <section class="card">
   <h2>Имэйлээр эрх өгөх</h2>
   <form class="grant" onsubmit="grant(event)">
    <input class="field" type="email" id="gEmail" placeholder="хэрэглэгчийн@имэйл" required>
    <input class="field" type="number" id="gDays" value="${cfg.PREMIUM_DAYS||30}" min="1" max="3660" title="Хоног">
    <button class="btn" type="submit">Эрх өгөх</button>
   </form>
   <p class="note">Хэрэглэгч сайтад нэг удаа нэвтэрсэн байх ёстой. Хугацаа нь одоогийн эрх дээр нэмэгдэнэ.</p>
  </section>`;
}
function reqList(rows){
 if(!rows||!rows.length) return '<div class="empty">Хүсэлт алга.</div>';
 return rows.map(r=>`<div class="rq">
  <div><div class="who">${esc(r.payer_name)} <span class="st ${r.status}">${({pending:'Хүлээгдэж буй',approved:'Батлагдсан',rejected:'Татгалзсан'})[r.status]}</span></div>
   <div class="meta">${esc(r.email)} · <span class="ref">${esc(r.ref_code)}</span> · <b>${fmt(r.amount)}₮</b> · ${dt(r.created_at)}</div>
   ${r.note?`<div class="meta">📝 ${esc(r.note)}</div>`:''}${r.admin_note?`<div class="meta">↩︎ ${esc(r.admin_note)}</div>`:''}</div>
  <div class="act">${r.status==='pending'?`<input type="number" id="d-${r.id}" value="${cfg.PREMIUM_DAYS||30}" min="1" max="3660" title="Хоног">
   <button class="btn sm ok" onclick="approve('${r.id}',this)">✓ Батлах</button><button class="btn sm no" onclick="askReject('${r.id}')">✕</button>`:`<span class="meta">${dt(r.reviewed_at)}</span>`}</div>
 </div>`).join('');
}
function premiumList(rows){
 if(!rows||!rows.length) return '<div class="empty">Идэвхтэй премиум хэрэглэгч алга.</div>';
 return rows.map(p=>`<div class="rq"><div><div class="who">${esc(p.email)}</div><div class="meta">Бүртгүүлсэн: ${dt(p.created_at)}</div></div>
  <div class="act"><span class="meta">${new Date(p.premium_until).toLocaleDateString()} хүртэл</span></div></div>`).join('');
}
const FBK={idea:'💡 Санал',bug:'🐞 Алдаа',place:'📍 Газар нэмүүлэх',other:'✉️ Бусад'};
function fbList(rows){
 if(!rows||!rows.length) return '<div class="empty">Санал хүсэлт алга.</div>';
 return rows.map(f=>`<div class="rq" style="${f.status==='done'?'opacity:.55':''}">
  <div><div class="who">${FBK[f.kind]||f.kind} ${f.status==='new'?'<span class="st pending">Шинэ</span>':'<span class="st approved">Шийдсэн</span>'}</div>
   <div style="white-space:pre-wrap;margin:4px 0">${esc(f.message)}</div>
   <div class="meta">${f.name?esc(f.name)+' · ':''}${f.contact?esc(f.contact)+' · ':''}${dt(f.created_at)}${f.page?' · '+esc(f.page):''}</div></div>
  <div class="act">${f.status==='new'?`<button class="btn sm ok" onclick="fbStatus('${f.id}','done')">✓ Шийдсэн</button>`:`<button class="btn sm no" onclick="fbStatus('${f.id}','new')">↩︎</button>`}</div>
 </div>`).join('');
}
async function fbStatus(id,st){
 const {error}=await Auth.setFeedbackStatus(id,st);
 if(error){toast('Алдаа: '+error.message);return}
 load();
}
function fuelList(rows){
 if(!rows||!rows.length) return '<div class="empty">05_fuel_homestay.sql ажиллуулаагүй байна.</div>';
 return `<p class="note">Үнийг өөрчлөөд «Хадгалах» дарна. Хэрэглэгчдэд шууд харагдана.</p>`+rows.map(f=>`<div class="rq"><div><div class="who">${esc(f.name)}</div><div class="meta">Шинэчилсэн: ${dt(f.updated_at)}</div></div>
  <div class="act"><input type="number" id="fp-${f.code}" value="${f.price}" min="0" step="10" style="width:100px">₮ <button class="btn sm ok" onclick="saveFuel('${f.code}',this)">Хадгалах</button></div></div>`).join('');
}
async function saveFuel(code,btn){
 const v=Math.round(+$('#fp-'+code).value);
 if(!(v>0)){toast('Үнэ буруу');return}
 btn.disabled=true;
 const {error}=await Auth.updateFuel(code,v);
 btn.disabled=false;
 if(error){toast('Алдаа: '+error.message);return}
 toast('✅ Хадгаллаа');load();
}
const HSO={stay:'🛏️ Хонох',airag:'🥛 Айраг',dairy:'🧀 Цагаан идээ',meat:'🥩 Мах',craft:'🧶 Гар урлал',horse:'🐎 Морь/тэмээ'};
function hsList(rows){
 if(!rows||!rows.length) return '<div class="empty">Айл буудлын санал алга.</div>';
 return rows.map(h=>`<div class="rq" style="${h.status==='rejected'?'opacity:.5':''}">
  <div><div class="who">${esc(h.name)} <span class="st ${h.status==='approved'?'approved':h.status==='rejected'?'rejected':'pending'}">${h.status==='approved'?'Нийтэлсэн':h.status==='rejected'?'Татгалзсан':'Шинэ'}</span></div>
   <div class="meta">${esc(h.aimag)}${h.soum?' · '+esc(h.soum):''}${h.phone?' · 📞 '+esc(h.phone):''}${h.fb?` · <a href="${esc(h.fb)}" target="_blank" rel="noopener nofollow">FB</a>`:''} · ${dt(h.created_at)}</div>
   <div class="meta">${(h.offers||[]).map(o=>HSO[o]||esc(o)).join(', ')}${h.season?' · '+esc(h.season):''}</div>
   ${h.note?`<div style="white-space:pre-wrap;margin-top:4px">${esc(h.note)}</div>`:''}</div>
  <div class="act">${h.status!=='approved'?`<button class="btn sm ok" onclick="hsSet('${h.id}','approved')">✓ Нийтлэх</button>`:''}${h.status!=='rejected'?`<button class="btn sm no" onclick="hsSet('${h.id}','rejected')">✕</button>`:''}</div>
 </div>`).join('');
}
async function hsSet(id,st){
 const {error}=await Auth.setHomestayStatus(id,st);
 if(error){toast('Алдаа: '+error.message);return}
 load();
}

// ---- Зураг ----
function photoAdm(rows){
 if(!rows||!rows.length) return '<div class="empty">Зураг алга.</div>';
 rows=rows.slice().sort((a,b)=>(a.status==='pending'?0:1)-(b.status==='pending'?0:1));
 return '<div class="adm-ph">'+rows.map(p=>`<div class="adm-phc" style="${p.status==='rejected'?'opacity:.45':''}">
  <a href="${esc(p.url)}" target="_blank"><img src="${esc(p.url)}" alt="" loading="lazy"></a>
  <div class="meta">@${esc(p.author)} · ${esc(p.aimag)}${p.place?' · '+esc(p.place):''} · ❤️ ${p.likes}</div>
  ${p.caption?`<div class="meta">${esc(p.caption)}</div>`:''}
  <div class="act" style="justify-content:flex-start;margin-top:6px"><span class="st ${p.status==='approved'?'approved':p.status==='rejected'?'rejected':'pending'}">${STS[p.status]||p.status}</span>
   ${p.status!=='approved'?`<button class="btn sm ok" onclick="phSet('${p.id}','approved')">✓</button>`:''}${p.status!=='rejected'?`<button class="btn sm no" onclick="phSet('${p.id}','rejected')">✕</button>`:''}<button class="btn sm no" onclick="phDel('${p.id}')">🗑️</button></div></div>`).join('')+'</div>';
}
async function phSet(id,st){const {error}=await Auth.setPhotoStatus(id,st);if(error){toast('Алдаа: '+error.message);return}load()}
async function phDel(id){if(!confirm('Зургийг устгах уу?'))return;const {error}=await Auth.deletePhoto(id);if(error){toast(error.message);return}load()}
// ---- Түүх ----
const STS={draft:'Ноорог',pending:'Шинэ',approved:'Нийтэлсэн',rejected:'Татгалзсан'};
function storyAdm(rows){
 if(!rows||!rows.length) return '<div class="empty">Түүх алга.</div>';
 rows=rows.filter(r=>r.status!=='draft').sort((a,b)=>(a.status==='pending'?0:1)-(b.status==='pending'?0:1));
 return rows.map(r=>`<div class="rq" style="${r.status==='rejected'?'opacity:.5':''}">
  <div><div class="who"><a href="./#story/${r.id}" target="_blank">${esc(r.title)}</a> <span class="st ${r.status==='approved'?'approved':r.status==='rejected'?'rejected':'pending'}">${STS[r.status]}</span></div>
   <div class="meta">@${esc(r.author)} · ${dt(r.created_at)} · ❤️ ${r.likes} · 💬 ${r.comments}</div>
   <div class="meta">${esc((r.excerpt||r.body||'').slice(0,160))}…</div></div>
  <div class="act">${r.status!=='approved'?`<button class="btn sm ok" onclick="stSet('${r.id}','approved')">✓ Нийтлэх</button>`:''}${r.status!=='rejected'?`<button class="btn sm no" onclick="stReject('${r.id}')">✕</button>`:''}<button class="btn sm no" onclick="stDel('${r.id}')">🗑️</button></div></div>`).join('');
}
async function stSet(id,st,note){const {error}=await Auth.setStoryStatus(id,st,note);if(error){toast('Алдаа: '+error.message);return}toast('✅');load()}
function stReject(id){const n=prompt('Татгалзсан шалтгаан (зохиогчид харагдана):','Агуулга дүрэмд нийцэхгүй байна');if(n!==null)stSet(id,'rejected',n)}
async function stDel(id){if(!confirm('Түүхийг бүр мөсөн устгах уу?'))return;const {error}=await Auth.deleteStory(id);if(error){toast(error.message);return}load()}
// ---- Кемп ----
function campAdm(rows){
 if(!rows||!rows.length) return '<div class="empty">Кемп алга.</div>';
 return rows.map(c=>`<div class="rq" style="${c.status==='rejected'?'opacity:.5':''}">
  <div><div class="who">${esc(c.name)} <span class="st ${c.status==='approved'?'approved':c.status==='rejected'?'rejected':'pending'}">${c.status==='approved'?'Нийтэлсэн':c.status==='rejected'?'Татгалзсан':'Шинэ'}</span>
    ${c.is_owner?'<span class="st approved">Эзэмшигч</span>':'<span class="st">Аялагч</span>'}${c.verified?' ✓':''}${c.featured?' ⭐':''}</div>
   <div class="meta">${esc(c.aimag)}${c.soum?' · '+esc(c.soum):''}${c.near?' · '+esc(c.near):''}${c.phone?' · 📞 '+esc(c.phone):''} · ${dt(c.created_at)}</div>
   <div class="meta">${['fb','ig','web'].filter(k=>c[k]).map(k=>`<a href="${esc(c[k])}" target="_blank" rel="noopener nofollow">${k}</a>`).join(' · ')}${c.price?' · '+esc(c.price):''}${c.season?' · '+esc(c.season):''}${c.photo?` · <a href="${esc(c.photo)}" target="_blank">зураг</a>`:''}${c.lat?` · <a href="https://maps.google.com/?q=${c.lat},${c.lng}" target="_blank">GPS</a>`:''}</div>
   ${c.description?`<div style="white-space:pre-wrap;margin-top:4px;font-size:14px">${esc(c.description)}</div>`:''}</div>
  <div class="act">${c.status!=='approved'?`<button class="btn sm ok" onclick="cpSet('${c.id}',{status:'approved'})">✓ Нийтлэх</button>`:''}${c.status!=='rejected'?`<button class="btn sm no" onclick="cpSet('${c.id}',{status:'rejected'})">✕</button>`:''}
   <button class="btn sm ${c.verified?'no':'ok'}" onclick="cpSet('${c.id}',{verified:${!c.verified}})">${c.verified?'Баталгаа хасах':'✓ Баталгаажсан'}</button>
   <button class="btn sm ${c.featured?'no':''}" onclick="cpSet('${c.id}',{featured:${!c.featured}})">${c.featured?'Онцлохоос хасах':'⭐ Онцлох'}</button>
   <button class="btn sm no" onclick="cpDel('${c.id}')">🗑️</button></div></div>`).join('');
}
async function cpSet(id,patch){const {error}=await Auth.updateCamp(id,patch);if(error){toast('Алдаа: '+error.message);return}load()}
async function cpDel(id){if(!confirm('Кемпийг устгах уу?'))return;const {error}=await Auth.deleteCamp(id);if(error){toast(error.message);return}load()}
// ---- Замын мэдээ ----
const RK={flood:'🌊 Үер',bridge:'🌉 Гүүр',mud:'🟤 Шавар',snow:'❄️ Цас/мөс',closed:'⛔ Хаалттай',nofuel:'⛽ Шатахуун',works:'🚧 Засвар',other:'⚠️ Бусад'};
function roadAdm(rows){
 if(!rows||!rows.length) return '<div class="empty">Замын мэдээ алга.</div>';
 return rows.map(r=>`<div class="rq" style="${r.hidden?'opacity:.5':''}">
  <div><div class="who">${RK[r.kind]||r.kind} — ${esc(r.place)} ${r.hidden?'<span class="st rejected">Нуусан</span>':''}</div>
   <div class="meta">${esc(r.aimag)} · ${r.author?'@'+esc(r.author)+' · ':''}${dt(r.created_at)} · 👍 ${r.confirms} · ✅ ${r.resolved}</div>
   ${r.note?`<div class="meta">${esc(r.note)}</div>`:''}</div>
  <div class="act"><button class="btn sm ${r.hidden?'ok':'no'}" onclick="rdHide('${r.id}',${!r.hidden})">${r.hidden?'Харуулах':'Нуух'}</button><button class="btn sm no" onclick="rdDel('${r.id}')">🗑️</button></div></div>`).join('');
}
async function rdHide(id,h){const {error}=await Auth.hideRoad(id,h);if(error){toast(error.message);return}load()}
async function rdDel(id){if(!confirm('Устгах уу?'))return;const {error}=await Auth.deleteRoad(id);if(error){toast(error.message);return}load()}
// ---- Мэдээлэл (report) ----
const RT={photo:'📷 Зураг',story:'📖 Түүх',comment:'💬 Сэтгэгдэл',camp:'🏕️ Кемп',review:'⭐ Үнэлгээ',road:'🚧 Замын мэдээ'};
function reportAdm(rows){
 if(!rows||!rows.length) return '<div class="empty">Мэдээлэл алга.</div>';
 return rows.map(r=>`<div class="rq" style="${r.status==='done'?'opacity:.5':''}">
  <div><div class="who">${RT[r.target_type]||r.target_type} ${r.status==='new'?'<span class="st pending">Шинэ</span>':''}</div>
   <div>${esc(r.reason||'')}</div><div class="meta">${dt(r.created_at)} · ${r.target_id}</div></div>
  <div class="act">${r.target_type==='story'?`<a class="btn sm" href="./#story/${r.target_id}" target="_blank">Харах</a>`:r.target_type==='camp'?`<a class="btn sm" href="./#camp/${r.target_id}" target="_blank">Харах</a>`:`<button class="btn sm no" onclick="rpHide('${r.target_type}','${r.target_id}','${r.id}')">Нуух</button>`}
   ${r.status==='new'?`<button class="btn sm ok" onclick="rpDone('${r.id}')">✓ Шийдсэн</button>`:''}</div></div>`).join('');
}
async function rpDone(id){const {error}=await Auth.setReportStatus(id,'done');if(error){toast(error.message);return}load()}
async function rpHide(type,tid,rid){
 const f=type==='photo'?(id=>Auth.setPhotoStatus(id,'rejected')):type==='comment'?Auth.hideComment:type==='review'?Auth.hideReview:type==='road'?(id=>Auth.hideRoad(id,true)):null;
 if(!f) return; const {error}=await f(tid); if(error){toast(error.message);return}
 await Auth.setReportStatus(rid,'done'); toast('Нууллаа'); load();
}
function setTab(k){tab=k;load()}
async function approve(id,btn){
 const days=+($('#d-'+id).value)||cfg.PREMIUM_DAYS||30;
 btn.disabled=true;
 const {error}=await Auth.approve(id,days);
 if(error){btn.disabled=false;toast('Алдаа: '+error.message);return}
 toast(`✅ Батлагдлаа — ${days} хоног нээгдлээ`);load();
}
function askReject(id){
 openModal(`<h3>Хүсэлтээс татгалзах</h3><form onsubmit="doReject(event,'${id}')">
  <input class="field" id="rjReason" maxlength="300" placeholder="Шалтгаан (хэрэглэгчид харагдана)" value="Дансанд төлбөр орж ирээгүй байна">
  <button class="btn wide" type="submit" style="background:var(--red)">Татгалзах</button></form>`);
}
async function doReject(e,id){
 e.preventDefault();
 const {error}=await Auth.reject(id,$('#rjReason').value.trim());
 closeModal();
 if(error){toast('Алдаа: '+error.message);return}
 toast('Татгалзлаа');load();
}
async function grant(e){
 e.preventDefault();
 const email=$('#gEmail').value.trim(), days=+$('#gDays').value||30;
 const {error}=await Auth.grantByEmail(email,days);
 if(error){toast('Алдаа: '+error.message);return}
 toast(`✅ ${email}-д ${days} хоног нээгдлээ`);$('#gEmail').value='';load();
}
Auth.onChange(()=>{admin=null;load()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
load();
</script>
</body>
</html>
